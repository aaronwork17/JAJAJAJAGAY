
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christofer Hueco</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 35px;
            background: linear-gradient(135deg, #080808, #202020, #080808);
            font-family: 'Cinzel', serif;
            padding: 30px;
        }

        h1 {
            font-size: clamp(2.5rem, 9vw, 7rem);
            font-weight: 900;
            text-align: center;
            color: #f5d98b;
            letter-spacing: 8px;
            text-shadow: 0 0 15px #c9a44c,
                         0 0 35px rgba(201, 164, 76, 0.5);
        }

        img {
            width: min(350px, 85vw);
            border-radius: 20px;
            border: 3px solid #f5d98b;
            box-shadow: 0 0 30px rgba(201, 164, 76, 0.4);
        }
    </style>
</head>

<body>

    <h1>CHRISTOFER HUECO</h1>

    <img src="images.jpg" alt="Christofer Hueco">

</body>
</html>
